name: Build and deploy Workwell to GitHub Pages

on:
  push: {}
  workflow_dispatch: {}

permissions:
  contents: read

# Branch builds cannot cancel the default branch's deployment.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      VITE_PAGES: 'true'
      # Public build-time configuration, not a secret or an API key.
      VITE_BACKEND_URL: ${{ vars.WORKWELL_BACKEND_URL }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Read GitHub Pages configuration
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Check backend configuration
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const value = process.env.VITE_BACKEND_URL?.trim();
          if (!value) {
            console.log('::notice::No WORKWELL_BACKEND_URL configured. Deploying the frontend interface; live analysis requires a separately hosted FastAPI service.');
          } else {
            const url = new URL(value);
            if (url.protocol !== 'https:' || url.username || url.password || url.search || url.hash) {
              throw new Error('WORKWELL_BACKEND_URL must be a public HTTPS backend URL without credentials, a query, or a fragment.');
            }
          }
          JS

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check and build for the Pages path
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build -- --base "${PAGES_BASE_PATH}/"

      - name: Upload static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
          retention-days: 1

  deploy:
    # Every push builds. Only the repository's default branch publishes the site.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
